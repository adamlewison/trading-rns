[project]
name = "trading-rns"
version = "0.1.0"
description = "Research pipeline: do UK small-cap / AIM shares drift after pre-open RNS announcements?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-calamine>=0.9.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
